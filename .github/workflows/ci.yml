name: Continuous Integration

on:
  pull_request:
    branches:
      - main

# The workflow only reads the code: the token it gets cannot push, comment or change
# settings, even if a dependency or step is compromised.
permissions:
  contents: read

jobs:
  design-lint-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The design check compares the pull request with its base branch.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Only lines the pull request adds or changes are checked; see DESIGN.md.
      - name: Check the design system
        run: |
          npm run design:test
          node scripts/check-design.mjs --base "$(git merge-base origin/${{ github.base_ref }} HEAD)"

      - name: Install dependencies
        run: npm ci

      - name: Lint the code
        run: npm run lint

      - name: Build the project
        run: npm run build
